<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f97316" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#0a0a0a"/>

  <!-- Glow -->
  <circle cx="256" cy="256" r="256" fill="url(#glow)"/>

  <!-- Abstract D using dots - 7 cols x 9 rows, spacing ~45, dot radius ~16 -->
  <g filter="url(#shadow)">
    <!-- Row 0 -->
    <circle cx="121" cy="76" r="16" fill="#fff"/>
    <circle cx="166" cy="76" r="16" fill="#fff"/>
    <circle cx="211" cy="76" r="16" fill="#fff"/>
    <circle cx="256" cy="76" r="16" fill="#f97316"/>
    <circle cx="301" cy="76" r="16" fill="#f97316"/>

    <!-- Row 1 -->
    <circle cx="121" cy="121" r="16" fill="#fff"/>
    <circle cx="166" cy="121" r="16" fill="#fff"/>
    <circle cx="211" cy="121" r="16" fill="#fff"/>
    <circle cx="256" cy="121" r="16" fill="#f97316"/>
    <circle cx="301" cy="121" r="16" fill="#f97316"/>
    <circle cx="346" cy="121" r="16" fill="#f97316"/>

    <!-- Row 2 -->
    <circle cx="121" cy="166" r="16" fill="#fff"/>
    <circle cx="166" cy="166" r="16" fill="#fff"/>
    <circle cx="301" cy="166" r="16" fill="#f97316"/>
    <circle cx="346" cy="166" r="16" fill="#f97316"/>
    <circle cx="391" cy="166" r="16" fill="#f97316"/>

    <!-- Row 3 -->
    <circle cx="121" cy="211" r="16" fill="#fff"/>
    <circle cx="166" cy="211" r="16" fill="#fff"/>
    <circle cx="346" cy="211" r="16" fill="#f97316"/>
    <circle cx="391" cy="211" r="16" fill="#f97316"/>

    <!-- Row 4 -->
    <circle cx="121" cy="256" r="16" fill="#fff"/>
    <circle cx="166" cy="256" r="16" fill="#fff"/>
    <circle cx="346" cy="256" r="16" fill="#f97316"/>
    <circle cx="391" cy="256" r="16" fill="#f97316"/>

    <!-- Row 5 -->
    <circle cx="121" cy="301" r="16" fill="#fff"/>
    <circle cx="166" cy="301" r="16" fill="#fff"/>
    <circle cx="346" cy="301" r="16" fill="#f97316"/>
    <circle cx="391" cy="301" r="16" fill="#f97316"/>

    <!-- Row 6 -->
    <circle cx="121" cy="346" r="16" fill="#fff"/>
    <circle cx="166" cy="346" r="16" fill="#fff"/>
    <circle cx="301" cy="346" r="16" fill="#f97316"/>
    <circle cx="346" cy="346" r="16" fill="#f97316"/>
    <circle cx="391" cy="346" r="16" fill="#f97316"/>

    <!-- Row 7 -->
    <circle cx="121" cy="391" r="16" fill="#fff"/>
    <circle cx="166" cy="391" r="16" fill="#fff"/>
    <circle cx="211" cy="391" r="16" fill="#f97316"/>
    <circle cx="256" cy="391" r="16" fill="#f97316"/>
    <circle cx="301" cy="391" r="16" fill="#f97316"/>
    <circle cx="346" cy="391" r="16" fill="#f97316"/>

    <!-- Row 8 -->
    <circle cx="121" cy="436" r="16" fill="#fff"/>
    <circle cx="166" cy="436" r="16" fill="#fff"/>
    <circle cx="211" cy="436" r="16" fill="#f97316"/>
    <circle cx="256" cy="436" r="16" fill="#f97316"/>
    <circle cx="301" cy="436" r="16" fill="#f97316"/>
  </g>
</svg>
